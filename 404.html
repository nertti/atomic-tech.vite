<!DOCTYPE HTML>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>404 Page</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="normal-page">

	<div class="maxwidth">

		{{> header }}

		<section class="err section">
					<div class="fixed">

						<div class="err__in">

							<div class="err__toptitle section-title section-title--36">
								Страница не найдена
							</div>

							<div class="err__image flex">
								<img src="img/404.png" alt="Страница не найдена">
							</div>

							<div class="err__back flex">
								<a href="/" class="err__back-btn btn flex">
									<span class="btn__text">Вернуться на главную</span>
								</a>
							</div>

						</div>

					</div>
				</section>


		{{> mob }}

	</div>

	<script type="module" src="/src/js/main.js"></script>

</body>
</html>
