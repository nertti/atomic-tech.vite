<!DOCTYPE HTML>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<title>Policy Page</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="normal-page">

	<div class="maxwidth">

		{{> header }}

		<section class="policy section">
					<div class="fixed">

						<div class="policy__in">

							<div class="policy__top section-top flex">
								<div class="section-top__col section-top__col--1">
									<div class="policy__title section-title section-title--64">
										Политика конфиденциальности
									</div>
								</div>
								<div class="section-top__col section-top__col--2">
									<div class="policy__back flex">
										<a href="#" class="policy__back-btn btn btn--ico flex">
											<span class="btn__arrow"><svg width="24" height="16" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M23.2277 7.91847H0.666504M0.666504 7.91847L7.43486 0.666656M0.666504 7.91847L7.43486 15.1703" stroke="black" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
											<span class="btn__text">Назад</span>
										</a>
									</div>
								</div>
							</div>

							<div class="policy__text is-text">

								Нужен нормальный html код политики, с фигмы копируется сплошным текстом без абзацев

							</div>

						</div>

					</div>
				</section>


		{{> mob }}

	</div>

	<script type="module" src="/src/js/main.js"></script>

</body>
</html>
